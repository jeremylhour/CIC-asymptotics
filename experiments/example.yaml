# ----------------------------------
# EXAMPLE CONFIGURATION FILE
# ----------------------------------

simulation_size: 100

config:
  dgp: limit-case
  n: 100
  params:
    d1: .1
    d2: .1
    b1: .1
    b2: .1

estimators:
  Standard kernel:
    cdf_method: standard
    se_method: kernel

  Standard Xavier:
    cdf_method: standard
    se_method: xavier

  Smoothed kernel:
    cdf_method: smoothed
    se_method: kernel

  Smoothed LS:
    cdf_method: smoothed
    se_method: lewbel-schennach

  Smoothed Xavier:
    cdf_method: smoothed
    se_method: xavier

  Sample splitting:
    cdf_method: smoothed
    se_method: sample-splitting

output_path: output/